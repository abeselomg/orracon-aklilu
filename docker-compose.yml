services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orracon
      POSTGRES_PASSWORD: orracon
      POSTGRES_DB: tickets
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orracon -d tickets"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
